name: Maven TestNG Runner

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Specific TestNG XML
        run: mvn clean test -DsuiteXmlFile=testNgXMLfiles/FakerSmokeTest.xml

      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@v3.1.2
        with:
          name: extent-reports
          path: reports


      - name: Run User Tests
        run: mvn clean test -DsuiteXmlFile=testNgXMLfiles/generateReport.xml

      - name: Archive extent reports
        if: always()
        uses: actions/upload-artifact@v3.1.2
        with:
          name: extent-reports
          path: reports
